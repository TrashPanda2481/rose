[package]
name = "rose-kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rose-kernel"
path = "src/main.rs"

[dependencies]
limine = "0.6.5"
abi = { package = "rose-abi", path = "../abi" }

[features]
# The legacy ring-3 self-test (kernel/src/usermode.rs). Off by default:
# a normal boot hands off to the root task instead. Kept as an opt-in
# regression artifact, since it exercises CSpace/Untyped/IPC error paths
# the root program does not. See
# docs/cores/kernel/plans/root-task-handoff.md.
usermode_selftest = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
